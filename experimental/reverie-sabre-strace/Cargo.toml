[package]
name = "reverie-sabre-strace"
description = "Strace tool for the experimental Reverie SaBRe instrumentation backend."
version = "0.5.4"
authors = ["Meta Platforms"]
edition = "2021"
repository = "https://github.com/rrnewton/hermit-3rdparty-patching"
license = "BSD-2-Clause"

[lib]
name = "reverie_sabre_strace_plugin"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "reverie-sabre-strace"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.75"
clap = { version = "4.6.2", features = ["derive", "env"] }
libc = "0.2.139"
nostd-print = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "b5819d62a440bdb336d1db042972711881c0f944" }
reverie = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "b5819d62a440bdb336d1db042972711881c0f944", package = "reverie-core" }
# The source-ready Tool-only API is staged against this source baseline; the
# final core commit must be pinned before this extension is build-ready.
reverie-examples = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "b5819d62a440bdb336d1db042972711881c0f944", default-features = false }
reverie-host = { version = "0.5.4", path = "../reverie-host" }
reverie-kvm = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "b5819d62a440bdb336d1db042972711881c0f944" }
reverie-ptrace = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "b5819d62a440bdb336d1db042972711881c0f944" }
reverie-process = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "b5819d62a440bdb336d1db042972711881c0f944" }
reverie-rpc-transport = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "b5819d62a440bdb336d1db042972711881c0f944" }
reverie-sabre = { version = "0.5.4", path = "../reverie-sabre" }
reverie-syscalls = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "b5819d62a440bdb336d1db042972711881c0f944" }
reverie-util = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "b5819d62a440bdb336d1db042972711881c0f944" }
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.140"
syscalls = { version = "0.6.7", features = ["serde"] }
tempfile = "3.27.0"
tokio = { version = "1.37.0", features = ["rt", "macros"] }
tracing = "0.1.41"
