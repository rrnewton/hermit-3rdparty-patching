[package]
name = "riptrace"
description = "Experimental syscall tracing frontend built on the Reverie SaBRe backend."
version = "0.5.4"
authors = ["Meta Platforms"]
edition = "2021"
repository = "https://github.com/rrnewton/hermit-3rdparty-patching"
license = "BSD-2-Clause"

[dependencies]
anyhow = "1.0.75"
async-trait = "0.1.71"
clap = { version = "3.2.25", features = ["derive", "env", "regex", "unicode"] }
colored = "2.1.0"
reverie-host = { version = "0.5.4", path = "../reverie-host" }
reverie-process = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "b5819d62a440bdb336d1db042972711881c0f944" }
riptrace-rpc = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "b5819d62a440bdb336d1db042972711881c0f944" }
syscalls = { version = "0.6.7", features = ["serde"] }
tokio = { version = "1.37.0", features = ["full", "test-util", "tracing"] }
