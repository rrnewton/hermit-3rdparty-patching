# Transferred from Reverie 882c91c02b981f56370a2912f0832b04fefc46ec: experimental/reverie-sabre/Cargo.toml.
# Maintained in this extension; original native ownership is recorded in the source mapping.

[package]
name = "reverie-sabre"
description = "Experimental SaBRe selective binary-rewriting backend for Reverie."
version = "0.5.4"
authors = ["Meta Platforms"]
edition = "2021"
repository = "https://github.com/rrnewton/hermit-3rdparty-patching"
license = "BSD-2-Clause AND GPL-3.0-or-later AND GPL-2.0-only AND BSD-3-Clause AND MIT AND LGPL-3.0-or-later"

[dependencies]
atomic = "0.5.1"
heapless = "0.8.0"
lazy_static = "1.4"
libc = "0.2.139"
mimalloc = { version = "0.1", default-features = false }
nostd-print = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "b5819d62a440bdb336d1db042972711881c0f944" }
parking_lot = { version = "0.12.1", features = ["send_guard"] }
reverie = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "b5819d62a440bdb336d1db042972711881c0f944", package = "reverie-core" }
reverie-memory = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "b5819d62a440bdb336d1db042972711881c0f944" }
reverie-inguest = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "b5819d62a440bdb336d1db042972711881c0f944", default-features = false, features = ["coordinator-rpc"] }
reverie-rpc = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "b5819d62a440bdb336d1db042972711881c0f944" }
reverie-rpc-transport = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "b5819d62a440bdb336d1db042972711881c0f944" }
reverie-sabre-stats = { version = "0.5.4", path = "../reverie-sabre-stats" }
reverie-sabre-macros = { version = "0.5.4", path = "../reverie-sabre-macros" }
reverie-syscalls = { version = "0.5.4", git = "https://github.com/rrnewton/reverie.git", rev = "b5819d62a440bdb336d1db042972711881c0f944" }
serde = { version = "1.0.185", features = ["derive", "rc"] }
syscalls = { version = "0.6.7", features = ["serde"] }

[build-dependencies]
cc = "1.0"

[dev-dependencies]
cc = "1.0"
tempfile = "3.27.0"
tokio = { version = "1.52.4", features = ["net", "rt"] }

[features]
# SaBRe's entry into the shared in-guest runtime's saved-register entry
# (shared_entry::dispatch_rewritten_syscall). Off by default: the plugin
# links the shared runtime's RCB clock only from the SaBRe switch on.
shared-entry = ["reverie-inguest/rcb-clock"]
# SaBRe's plugin ABI for the shared in-guest runtime
# (shared_runtime::shared_runtime_plugin!). Off by default: only a runtime
# library that is loaded as the SaBRe plugin enables it.
shared-runtime = ["shared-entry"]

[[example]]
name = "shared_runtime_plugin"
crate-type = ["cdylib"]
required-features = ["shared-runtime"]

[[test]]
name = "shared_runtime_plugin"
required-features = ["shared-runtime"]
