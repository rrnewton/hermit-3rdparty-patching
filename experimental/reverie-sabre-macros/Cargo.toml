[package]
name = "reverie-sabre-macros"
description = "Procedural macros for the experimental Reverie SaBRe backend."
version = "0.5.4"
authors = ["Meta Platforms"]
edition = "2021"
repository = "https://github.com/rrnewton/hermit-3rdparty-patching"
license = "BSD-2-Clause"

[lib]
test = false
doctest = false
proc-macro = true

[dependencies]
darling = "0.14.0"
heck = "0.3.1"
proc-macro2 = { version = "1.0.70", features = ["span-locations"] }
quote = "1.0.29"
syn = { version = "1.0.109", features = ["extra-traits", "fold", "full", "visit", "visit-mut"] }
