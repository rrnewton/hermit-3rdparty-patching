name: validate (hosted)

# Independent validate for hermit-3rdparty-patching (hermit-sabre +
# hermit-e9patch) on GitHub-hosted runners. No self-hosted runners, no
# /dev/kvm, no root. This workflow is the primary validate for this
# repository (owner directive 2026-11-03); the local route
# (`make validate-local`, ci/validate-local.sh) runs the same steps.
#
# Pins: HERMIT_PIN / REVERIE_PIN below are the exact published core
# commits this repo builds against (Cargo git rev). Keep them in sync
# with the member Cargo.toml files; the nightly scorecard in dev-hermit
# reports them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  HERMIT_PIN: 890f7e672ecd351644f53ab07fc78ad88a76af61
  REVERIE_PIN: 42b59ad872680b7e7815fc7a88ed76ca3a233832
  CARGO_TERM_COLOR: always

jobs:
  hosted-probe:
    # FIRST: prove the hosted runner permits ptrace and the syscalls the
    # backends need (e9patch preprocessing runs under core ptrace). If
    # this job fails, the repo needs a privileged executor after all --
    # report it, do not assume.
    runs-on: ubuntu-latest
    steps:
      - name: ptrace and syscall probe
        run: |
          python3 - <<'PY'
          import ctypes, os, sys
          libc = ctypes.CDLL(None, use_errno=True)
          PTRACE_TRACEME = 0
          pid = os.fork()
          if pid == 0:
              if libc.ptrace(PTRACE_TRACEME, 0, 0, 0) != 0:
                  os._exit(42)
              os._exit(0)
          _, status, rusage = os.wait4(pid, 0)
          print(f"PTRACE_TRACEME child exit status: {status}")
          try:
              scope = open("/proc/sys/kernel/yama/ptrace_scope").read().strip()
          except FileNotFoundError:
              scope = "(no yama)"
          print(f"yama ptrace_scope: {scope}")
          print(f"uname: {os.uname()}")
          if os.WEXITSTATUS(status) == 42:
              print("PTRACE_TRACEME REFUSED on this runner", file=sys.stderr)
              sys.exit(1)
          print("hosted ptrace probe: OK")
          PY

  unit:
    needs: hosted-probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out pinned core (dependency only)
        uses: actions/checkout@v4
        with:
          repository: rrnewton/hermit
          ref: ${{ env.HERMIT_PIN }}
          path: .core/hermit
      - name: Check out pinned Reverie (dependency only)
        uses: actions/checkout@v4
        with:
          repository: rrnewton/reverie
          ref: ${{ env.REVERIE_PIN }}
          path: .core/reverie
      - name: Verify Cargo pins match workflow pins
        run: |
          grep -rq "$HERMIT_PIN" --include=Cargo.toml .
          grep -rq "$REVERIE_PIN" --include=Cargo.toml .
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: System build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libunwind-dev liblzma-dev cmake zlib1g-dev
      - name: Unit tests
        # The cache-directory test needs a mapped-root user namespace,
        # which the hosted runner refuses to non-root (MapUid EPERM);
        # it runs as root in the next step instead of being skipped.
        # Guest-running integration targets (tests/sabre_examples.rs needs a
        # core HERMIT_BIN and executes guests) belong to the privileged
        # E2E lane; hosted unit scope is lib/bin tests.
        run: cargo test --locked --lib --bins -p hermit-patching-cli -p reverie-e9patch -p reverie-patching-examples -- --skip cache_directory_is_private_and_not_a_symlink
      - name: Namespace-dependent test (root)
        run: sudo env "PATH=$PATH" "CARGO_HOME=$CARGO_HOME" "RUSTUP_HOME=$RUSTUP_HOME" cargo test --locked -p hermit-patching-cli --lib -- --exact e9patch::tests::cache_directory_is_private_and_not_a_symlink
      - name: Python tests
        run: |
          if ls tests/*.py >/dev/null 2>&1; then python3 -m pytest tests/ -x -q; fi
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --locked -p hermit-patching-cli -p reverie-e9patch -p reverie-patching-examples -- -D warnings
