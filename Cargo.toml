# Source-only extension staging; compilation/loader qualification is not implied.
[workspace]
resolver = "2"
members = [
    "experimental/reverie-host",
    "experimental/reverie-sabre",
    "experimental/reverie-sabre-macros",
    "experimental/reverie-sabre-stats",
    "experimental/reverie-sabre-strace",
    "experimental/riptrace",
    "experimental/riptrace/tool",
    "reverie-e9patch",
    "reverie-patching-examples",
    "hermit-patching-cli",
]

# Unify every Reverie crate on the canonical Reverie git at the pin, so
# the graph carries one instance of each (the Hermit git source otherwise
# supplies its own path copies through the reverie submodule). Direct
# dependencies declare facebookexperimental sources; this table maps the
# Hermit-sourced copies onto the same canonical Reverie revision, which
# always follows Hermit's reverie gitlink. Generated from the pinned
# Reverie workspace member list; regenerate at every pin bump.
[patch."https://github.com/facebookexperimental/hermit"]
nostd-print = { git = "https://github.com/facebookexperimental/reverie.git", rev = "3271496c72233bf5310905a40431ae83e18c1bd9" }
